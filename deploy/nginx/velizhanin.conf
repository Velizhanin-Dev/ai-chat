# Reverse proxy для VELIZHANIN AI (Next.js standalone в docker compose).
# Кладётся в /etc/nginx/sites-available/velizhanin.conf, симлинк в sites-enabled.
#
#  ЗАМЕНИ velizhanin.com на свой домен (в т.ч. server_name).
#  Сначала ставим этот HTTP-конфиг, потом `certbot --nginx -d ...` сам допишет
#  443-блок и редирект 80→443, сохранив location'ы ниже.
#
# Ключевое:
#  - /api/chat отдаёт стриминг (SSE) → proxy_buffering off + длинный таймаут,
#    иначе токены копятся в буфере и «печатает…» висит, а потом валит всё разом.
#  - X-Forwarded-Proto https нужен, чтобы приложение знало, что снаружи HTTPS.

upstream velizhanin_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name velizhanin.com www.velizhanin.com;

    # Сжатие текстовых ответов.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Общие заголовки проксирования для всех location.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── Стриминг чата (Server-Sent Events) ──────────────────────────────────
    # Без буферизации — токены идут к юзеру сразу. Длинный read timeout, чтобы
    # долгая генерация не рвалась по таймауту.
    location /api/chat {
        proxy_pass http://velizhanin_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Подстраховка: запрещаем буферизацию и на стороне nginx-прокси.
        add_header X-Accel-Buffering no;
    }

    # ── Всё остальное приложение ────────────────────────────────────────────
    location / {
        proxy_pass http://velizhanin_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
