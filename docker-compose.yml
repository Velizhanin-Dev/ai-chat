services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creative_chat
    # слушаем только localhost: снаружи в БД не залезть, доступ — через SSH-туннель.
    # app ходит в postgres по внутренней docker-сети (host "postgres"), порт ему не нужен.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/creative_chat

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # ⚠️ NEXT_PUBLIC_* инлайнятся ПРИ СБОРКЕ, поэтому передаются сюда, а не только
      # в рантайм. Забыли переменную — фича тихо выключается в браузере: ошибок нет,
      # просто пусто (ловили на прокси картинок: превью не грузились без VPN).
      # Добавляете новую NEXT_PUBLIC_* — добавьте и сюда, и в Dockerfile (ARG+ENV).
      args:
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID}
        NEXT_PUBLIC_YT_IMG_PROXY: ${NEXT_PUBLIC_YT_IMG_PROXY}
        NEXT_PUBLIC_CLOUDPAYMENTS_PUBLIC_ID: ${NEXT_PUBLIC_CLOUDPAYMENTS_PUBLIC_ID}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    # наружу порт не публикуем — трафик идёт через Caddy по внутренней сети.
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/creative_chat
      # Референсы и сгенерированные превью пишутся сюда (volume ниже), в БД —
      # только пути. См. src/lib/uploads.ts.
      UPLOAD_DIR: /app/data/uploads
    volumes:
      # ⚠️ ИМЕНОВАННЫЙ volume, а НЕ bind-mount папки с хоста. Причина: контейнер
      # работает под uid 1001, а созданная на хосте папка принадлежит root —
      # приложение падало с EACCES на mkdir внутри /app/data/uploads, уже ПОСЛЕ
      # оплаченной генерации картинки. Docker при создании именованного volume
      # копирует владельца из образа (там 1001), поэтому права сходятся сами и
      # никакого chown на хосте делать не надо.
      # Бэкап: docker run --rm -v creative-chat_uploads:/d -v "$PWD":/b alpine tar czf /b/uploads.tar.gz -C /d .
      - uploads:/app/data/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file:
      - .env # отсюда берутся DOMAIN и ACME_EMAIL
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data # сюда Caddy кладёт выписанные сертификаты
      - ./data/caddy/config:/config

volumes:
  # Пользовательские файлы генератора превью: загруженные фото-референсы и
  # готовые обложки. В БД лежат только пути, сами файлы — здесь.
  uploads:
